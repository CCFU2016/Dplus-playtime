# Ruff for the Python browser tests (tests/ui/). Install with: pip install -r requirements-dev.txt
# Not in a pyproject.toml: Railway's builder would take the repo for a Python app and not find the Node server.
line-length = 120
target-version = "py311"
include = ["tests/ui/*.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# The formatter keeps lines to 120 where it can; a long check message stays on one line.
ignore = ["E501"]

[lint.isort]
known-first-party = ["support", "limits", "wallet", "estimate", "handoff", "ask"]

[format]
quote-style = "single"
